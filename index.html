<!doctype html>
<html lang="fr-FR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ALTARIS — High-Performance Climbing Analytics &amp; Training System.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#080D18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ALTARIS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ALTARIS Pro Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   ALTARIS™ — Design tokens
   Dark-native by client directive (CDC §1). Light theme opt-in.
   ============================================================ */
:root{
  --bg:#080D18; --bg-grad:#0A1020;
  --surface:#0F172A; --surface-2:#15203A; --surface-3:#1C2A49;
  --line:#243352; --line-soft:#1A2740;
  --ink:#E8EEF8; --ink-2:#9FB0CB; --ink-3:#6B7E9E;
  --accent:#22D3EE; --accent-2:#67E8F9; --accent-ink:#04141B; --accent-dim:#0E7C93;
  --accent-wash:rgba(34,211,238,.10); --accent-line:rgba(34,211,238,.30);
  --good:#35C48D; --warn:#E8A33D; --crit:#E8654F;
  --good-wash:rgba(53,196,141,.13); --warn-wash:rgba(232,163,61,.13); --crit-wash:rgba(232,101,79,.13);
  --s1:#1695B3; --s2:#AD7C13; --s3:#956DD4; --s4:#3D9D46; --s5:#5781E3; --s6:#D35A55;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 28px rgba(0,0,0,.42);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --r:12px; --r-sm:8px; --r-lg:18px;
  --tap:46px;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Barlow","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --maxw:1240px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#EDF1F7; --bg-grad:#F4F7FB;
  --surface:#FFFFFF; --surface-2:#F5F8FC; --surface-3:#E8EFF8;
  --line:#D2DCEA; --line-soft:#E3EAF4;
  --ink:#0F172A; --ink-2:#4A5B7A; --ink-3:#74859F;
  --accent:#0E7490; --accent-2:#0891B2; --accent-ink:#FFFFFF; --accent-dim:#0E7490;
  --accent-wash:rgba(14,116,144,.09); --accent-line:rgba(14,116,144,.28);
  --good:#0F8A5F; --warn:#B5730B; --crit:#C0453A;
  --good-wash:rgba(15,138,95,.11); --warn-wash:rgba(181,115,11,.11); --crit-wash:rgba(192,69,58,.11);
  --s1:#1388A4; --s2:#9E7110; --s3:#8A5FC9; --s4:#299236; --s5:#4B74D8; --s6:#C74B47;
  --shadow:0 1px 2px rgba(15,23,42,.07), 0 8px 24px rgba(15,23,42,.09);
  --shadow-sm:0 1px 2px rgba(15,23,42,.08);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
h1,h2,h3,h4{margin:0; text-wrap:balance; font-weight:600; letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:none; padding:0}
a{color:var(--accent); text-decoration:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
::selection{background:var(--accent-line); color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important; transition-duration:.001ms!important}}

/* ---------- typographic utilities ---------- */
.eyebrow{font:600 10.5px/1.2 var(--sans); letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3)}
.eyebrow.acc{color:var(--accent)}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.tiny{font-size:12px}
.small{font-size:13px}
.serif{font-family:var(--serif)}
.nowrap{white-space:nowrap}
.center{text-align:center}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- brand lockup ---------- */
.brand{display:flex; align-items:center; gap:9px; min-width:0}
.brand svg{display:block; flex:none}
.brand .mk{fill:var(--accent)}
.brand .wd{fill:var(--ink)}
.brand .tm{font:600 8px/1 var(--sans); fill:var(--ink-3); letter-spacing:.06em}

/* ---------- app shell ---------- */
#app{min-height:100vh; display:flex; flex-direction:column;
  background:
    radial-gradient(1100px 520px at 78% -12%, rgba(34,211,238,.055), transparent 62%),
    radial-gradient(760px 400px at 4% 4%, rgba(87,129,227,.05), transparent 60%),
    linear-gradient(178deg,var(--bg-grad),var(--bg) 46%);
}
.topbar{
  position:sticky; top:0; z-index:60; display:flex; align-items:center; gap:10px;
  padding:9px 14px; min-height:56px;
  background:color-mix(in srgb, var(--bg) 84%, transparent);
  backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
  border-bottom:1px solid var(--line-soft);
}
.topbar .spacer{flex:1 1 auto; min-width:0}
.topbar .role-lb{display:none}
@media(min-width:600px){.topbar .role-lb{display:inline}}
@media(max-width:400px){.brand svg:nth-of-type(2),.brand sup{display:none}}
main{flex:1 1 auto; width:100%; max-width:var(--maxw); margin:0 auto; padding:16px 14px 108px}
@media(min-width:900px){
  main{padding:22px 26px 46px}
  .topbar{padding:10px 26px}
}
footer.legal{
  border-top:1px solid var(--line-soft); padding:16px 14px 26px;
  color:var(--ink-3); font-size:11px; line-height:1.65; text-align:center;
}
@media(min-width:900px){footer.legal{padding:18px 26px 30px}}
footer.legal strong{color:var(--ink-2); font-weight:600}

/* ---------- nav: bottom tabs (mobile) / rail (desktop) ---------- */
.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:70; display:flex;
  background:color-mix(in srgb, var(--surface) 93%, transparent);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line); padding:5px 4px calc(5px + env(safe-area-inset-bottom));
}
.tabs button{
  flex:1 1 0; min-width:0; min-height:var(--tap); border-radius:10px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  color:var(--ink-3); padding:5px 2px; transition:color .14s, background .14s; position:relative;
}
.tabs button svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.tabs button span{font-size:9.5px; font-weight:600; letter-spacing:.03em; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tabs button.on{color:var(--accent); background:var(--accent-wash)}
.tabs button .dot{position:absolute; top:5px; right:calc(50% - 18px); width:7px; height:7px; border-radius:50%; background:var(--crit); border:1.5px solid var(--surface)}
@media(min-width:900px){
  .tabs{position:sticky; top:56px; bottom:auto; flex-direction:row; border-top:none;
    border-bottom:1px solid var(--line-soft); background:transparent; backdrop-filter:none;
    -webkit-backdrop-filter:none; padding:0 26px; gap:2px; max-width:var(--maxw); margin:0 auto; z-index:55;
    overflow-x:auto; scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto; flex-direction:row; gap:7px; padding:9px 13px; border-radius:9px 9px 0 0;
    min-height:42px; border-bottom:2px solid transparent}
  .tabs button span{font-size:12.5px; letter-spacing:.01em}
  .tabs button.on{background:transparent; border-bottom-color:var(--accent)}
  .tabs button:hover{color:var(--ink)}
  .tabs button .dot{position:static; margin-left:1px}
}

/* ---------- surfaces ---------- */
.panel{background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--r); box-shadow:var(--shadow-sm)}
.panel.pad{padding:16px}
.panel.flat{box-shadow:none; background:var(--surface-2)}
.stack{display:flex; flex-direction:column; gap:14px}
.stack.sm{gap:9px}
.stack.lg{gap:22px}
.row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.row.tight{gap:6px}
.row.nowrap{flex-wrap:nowrap}
.between{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap}
.grid{display:grid; gap:13px}
.g2{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}
.g-load,.g-split{display:grid; gap:13px; grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.g-load{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr); align-items:stretch}}
@media(min-width:900px){.g-split{grid-template-columns:minmax(0,1fr) minmax(0,.85fr)}}
.grid>*,.g-load>*,.g-split>*{min-width:0}
.chartbox{max-width:100%}
.chartbox svg{max-width:100%}
@media(max-width:760px){
  .chartbox.wide{overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px}
  .chartbox.wide svg{min-width:600px; max-width:none}
}
.sec-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:2px}
.sec-head h2{font-family:var(--serif); font-size:26px; font-weight:600; letter-spacing:0}
.sec-head p{color:var(--ink-2); font-size:13.5px; max-width:62ch}
@media(min-width:900px){.sec-head h2{font-size:31px}}

/* topographic rule — contour motif from the ALTARIS mark */
.topo{height:9px; width:100%; opacity:.5; overflow:hidden}
.topo svg{width:100%; height:100%}
.topo path{stroke:var(--line); fill:none; stroke-width:1}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  min-height:var(--tap); padding:0 17px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink); font-weight:600; font-size:14.5px;
  transition:background .14s,border-color .14s,transform .06s; white-space:nowrap;
}
.btn:hover{background:var(--surface-3); border-color:var(--line)}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.pri{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-2); border-color:var(--accent-2)}
.btn.ghost{background:transparent; border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.bare{background:transparent; border-color:transparent; padding:0 10px}
.btn.bare:hover{background:var(--surface-2)}
.btn.sm{min-height:34px; padding:0 12px; font-size:13px; border-radius:8px}
.btn.sm svg{width:15px;height:15px}
.btn.xs{min-height:28px; padding:0 9px; font-size:12px; border-radius:7px; font-weight:600}
.btn.xs svg{width:13px;height:13px}
.btn.wide{width:100%}
.btn.danger{color:var(--crit); border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.btn.danger:hover{background:var(--crit-wash)}
.btn[disabled]{opacity:.42; pointer-events:none}
.btn.icon{padding:0; width:var(--tap); flex:none}
.btn.icon.sm{width:34px}
.seg{display:inline-flex; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:2px; gap:2px}
.seg button{padding:6px 12px; border-radius:8px; font-size:13px; font-weight:600; color:var(--ink-2); min-height:34px; white-space:nowrap}
.seg button.on{background:var(--accent); color:var(--accent-ink)}
.seg.sm button{padding:4px 9px; min-height:28px; font-size:12px}

/* ---------- inputs ---------- */
label.f{display:flex; flex-direction:column; gap:5px; min-width:0}
label.f>.lb{font:600 11px/1.3 var(--sans); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
label.f>.hint{font-size:11.5px; color:var(--ink-3); line-height:1.45}
.inp{
  width:100%; min-height:var(--tap); padding:10px 12px; border-radius:10px;
  background:var(--surface-2); border:1px solid var(--line); color:var(--ink); font-size:15px;
  transition:border-color .14s, background .14s;
}
.inp:hover{border-color:var(--line)}
.inp:focus{outline:none; border-color:var(--accent); background:var(--surface-3)}
textarea.inp{min-height:82px; resize:vertical; line-height:1.5}
select.inp{appearance:none; cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%, calc(100% - 12px) 50%;
  background-size:5px 5px, 5px 5px; background-repeat:no-repeat; padding-right:34px}
.inp.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
input[type="number"].inp{-moz-appearance:textfield}
input[type="number"].inp::-webkit-outer-spin-button,input[type="number"].inp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.unit{display:flex; align-items:stretch}
.unit .inp{border-radius:10px 0 0 10px; border-right:none}
.unit .u{display:flex; align-items:center; padding:0 12px; background:var(--surface-3); border:1px solid var(--line);
  border-radius:0 10px 10px 0; color:var(--ink-3); font:500 13px var(--mono); white-space:nowrap}
.check{display:flex; align-items:flex-start; gap:9px; padding:10px 12px; border:1px solid var(--line);
  border-radius:10px; background:var(--surface-2); cursor:pointer; min-height:var(--tap); transition:border-color .14s,background .14s}
.check:hover{background:var(--surface-3)}
.check.on{border-color:var(--accent); background:var(--accent-wash)}
.check input{accent-color:var(--accent); width:17px; height:17px; margin-top:2px; flex:none}
.check .t{font-size:14px; line-height:1.4}
.check .d{font-size:11.5px; color:var(--ink-3); margin-top:2px; line-height:1.4}
input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:34px; background:transparent; cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:7px; border-radius:99px; background:var(--surface-3); border:1px solid var(--line)}
input[type=range]::-moz-range-track{height:7px; border-radius:99px; background:var(--surface-3); border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:26px; height:26px; border-radius:50%;
  background:var(--accent); border:3px solid var(--surface); margin-top:-10px; box-shadow:0 1px 6px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--surface)}

/* ---------- chips, badges, pills ---------- */
.chip{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px;
  background:var(--surface-3); border:1px solid var(--line); font-size:11.5px; font-weight:600; color:var(--ink-2); white-space:nowrap}
.chip.acc{background:var(--accent-wash); border-color:var(--accent-line); color:var(--accent)}
.chip.good{background:var(--good-wash); border-color:color-mix(in srgb,var(--good) 34%,transparent); color:var(--good)}
.chip.warn{background:var(--warn-wash); border-color:color-mix(in srgb,var(--warn) 34%,transparent); color:var(--warn)}
.chip.crit{background:var(--crit-wash); border-color:color-mix(in srgb,var(--crit) 34%,transparent); color:var(--crit)}
.chip button{display:flex; color:inherit; opacity:.65; margin-left:1px}
.chip button:hover{opacity:1}
.chip svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.filt{display:inline-flex; align-items:center; gap:5px; padding:6px 12px; border-radius:99px; min-height:34px;
  background:var(--surface-2); border:1px solid var(--line); font-size:12.5px; font-weight:600; color:var(--ink-2); transition:.14s}
.filt:hover{background:var(--surface-3); color:var(--ink)}
.filt.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.filt .n{font-family:var(--mono); font-size:11px; opacity:.7}
.avatar{width:38px; height:38px; border-radius:50%; flex:none; display:grid; place-items:center;
  font:600 13px var(--sans); letter-spacing:.02em; background:var(--surface-3); color:var(--ink-2);
  border:1px solid var(--line); text-transform:uppercase}
.avatar.lg{width:52px;height:52px;font-size:17px}
.avatar.sm{width:28px;height:28px;font-size:10.5px}
.avatar.acc{background:var(--accent-wash); color:var(--accent); border-color:var(--accent-line)}

/* ---------- data list rows ---------- */
.rows{display:flex; flex-direction:column}
.rows>*+*{border-top:1px solid var(--line-soft)}
.rw{display:flex; align-items:center; gap:11px; padding:12px 14px; width:100%; text-align:left; min-height:var(--tap)}
button.rw{transition:background .13s}
button.rw:hover{background:var(--surface-2)}
.rw .gr{flex:1 1 auto; min-width:0}
.rw .t1{display:block; font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rw .t2{display:block; font-size:12px; color:var(--ink-3); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rw .v{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:14px; font-weight:500; text-align:right; flex:none}
.chev{width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- KPI / metric tiles ---------- */
.kpi{padding:13px 14px; border-radius:var(--r); background:var(--surface); border:1px solid var(--line-soft); display:flex; flex-direction:column; gap:3px; min-width:0}
.kpi .k{font:600 10px/1.2 var(--sans); letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.kpi .v{font-family:var(--mono); font-size:25px; font-weight:500; letter-spacing:-.02em; line-height:1.15; font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12.5px; color:var(--ink-3); font-weight:400; margin-left:2px}
.kpi .s{font-size:11.5px; color:var(--ink-3); line-height:1.35}
.kpi.hero{background:linear-gradient(160deg,var(--surface-2),var(--surface)); border-color:var(--line)}
.kpi.hero .v{font-size:38px}
.kpi.good .v{color:var(--good)} .kpi.warn .v{color:var(--warn)} .kpi.crit .v{color:var(--crit)}
.kpi .bar{height:4px; border-radius:99px; background:var(--surface-3); overflow:hidden; margin-top:5px}
.kpi .bar i{display:block; height:100%; border-radius:99px; background:var(--accent)}

/* severity stripe for alert rows */
.stripe{border-left:3px solid var(--line); padding-left:11px; min-width:0}
.stripe.good{border-left-color:var(--good)} .stripe.warn{border-left-color:var(--warn)} .stripe.crit{border-left-color:var(--crit)}

/* ---------- tables ---------- */
.tw{overflow-x:auto; -webkit-overflow-scrolling:touch}
table.dt{border-collapse:collapse; width:100%; min-width:520px; font-size:13.5px}
table.dt th{text-align:left; font:600 10px/1.3 var(--sans); letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-3); padding:9px 11px; border-bottom:1px solid var(--line); white-space:nowrap; background:var(--surface-2)}
table.dt td{padding:10px 11px; border-bottom:1px solid var(--line-soft); vertical-align:middle}
table.dt tr:last-child td{border-bottom:none}
table.dt td.n{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
table.dt th.n{text-align:right}
table.dt tbody tr:hover{background:var(--surface-2)}

/* ---------- modal ---------- */
.scrim{position:fixed; inset:0; z-index:200; background:rgba(2,6,14,.68); backdrop-filter:blur(4px);
  display:flex; align-items:flex-end; justify-content:center; padding:0; animation:fade .16s ease}
@media(min-width:760px){.scrim{align-items:center; padding:26px}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.modal{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg) var(--r-lg) 0 0;
  width:100%; max-width:660px; max-height:92vh; display:flex; flex-direction:column; box-shadow:var(--shadow); animation:rise .2s ease}
@media(min-width:760px){.modal{border-radius:var(--r-lg); max-height:88vh}}
.modal.wide{max-width:880px}
.modal>header{display:flex; align-items:center; gap:11px; padding:15px 17px; border-bottom:1px solid var(--line-soft); flex:none}
.modal>header h3{font-family:var(--serif); font-size:21px; font-weight:600; flex:1 1 auto; min-width:0}
.modal>.body{padding:17px; overflow-y:auto; flex:1 1 auto; -webkit-overflow-scrolling:touch}
.modal>footer{display:flex; gap:9px; padding:13px 17px calc(13px + env(safe-area-inset-bottom)); border-top:1px solid var(--line-soft); flex:none}
.modal>footer .btn{flex:1 1 auto}

/* ---------- toast ---------- */
#toasts{position:fixed; z-index:300; left:50%; transform:translateX(-50%); bottom:78px;
  display:flex; flex-direction:column; gap:7px; align-items:center; pointer-events:none; width:max-content; max-width:92vw}
@media(min-width:900px){#toasts{bottom:22px; left:auto; right:22px; transform:none; align-items:flex-end}}
.toast{background:var(--surface-3); border:1px solid var(--line); border-radius:10px; padding:10px 14px;
  font-size:13.5px; font-weight:500; box-shadow:var(--shadow); animation:rise .18s ease; max-width:100%}
.toast.good{border-color:color-mix(in srgb,var(--good) 46%,transparent); color:var(--good)}
.toast.crit{border-color:color-mix(in srgb,var(--crit) 46%,transparent); color:var(--crit)}

/* ---------- empty / notice ---------- */
.empty{padding:34px 20px; text-align:center; color:var(--ink-3)}
.empty svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.4;opacity:.5;margin-bottom:9px}
.empty .t{font-size:14.5px; color:var(--ink-2); font-weight:600; margin-bottom:3px}
.empty .d{font-size:12.5px; max-width:44ch; margin:0 auto; line-height:1.55}
.notice{display:flex; gap:10px; padding:12px 14px; border-radius:10px; background:var(--surface-2);
  border:1px solid var(--line); font-size:12.5px; line-height:1.55; color:var(--ink-2)}
.notice svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;flex:none;margin-top:1px;stroke-linecap:round;stroke-linejoin:round}
.notice.warn{background:var(--warn-wash); border-color:color-mix(in srgb,var(--warn) 32%,transparent); color:var(--warn)}
.notice.crit{background:var(--crit-wash); border-color:color-mix(in srgb,var(--crit) 32%,transparent); color:var(--crit)}
.notice.acc{background:var(--accent-wash); border-color:var(--accent-line); color:var(--ink-2)}
.notice b{color:var(--ink)}

/* ---------- charts ---------- */
.chartbox{position:relative; width:100%}
.chartbox svg{display:block; width:100%; height:auto; overflow:visible}
.ctip{position:absolute; z-index:20; pointer-events:none; background:var(--surface-3); border:1px solid var(--line);
  border-radius:9px; padding:8px 11px; font-size:12px; box-shadow:var(--shadow); min-width:118px; opacity:0; transition:opacity .1s}
.ctip.on{opacity:1}
.ctip .h{font-weight:700; font-size:11.5px; margin-bottom:4px; color:var(--ink)}
.ctip .l{display:flex; align-items:center; gap:6px; justify-content:space-between; margin-top:2px; color:var(--ink-2)}
.ctip .l i{width:8px;height:8px;border-radius:2px;flex:none;display:inline-block}
.ctip .l b{font-family:var(--mono); font-weight:500; color:var(--ink); font-variant-numeric:tabular-nums}
.legend{display:flex; flex-wrap:wrap; gap:6px 15px; font-size:11.5px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:9px; height:9px; border-radius:2.5px; flex:none}
.legend i.ln{height:3px; width:14px; border-radius:2px}
.ax{fill:var(--ink-3); font-family:var(--mono); font-size:9.5px}
.axl{fill:var(--ink-2); font-family:var(--sans); font-size:10.5px; font-weight:600}
.gridln{stroke:var(--line-soft); stroke-width:1}
.gridln.b{stroke:var(--line)}

/* ---------- calendar ---------- */
.cal{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px}
.cal .dh{font:600 10px/1 var(--sans); letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
  text-align:center; padding:5px 0}
.day{min-height:96px; border-radius:9px; background:var(--surface-2); border:1px solid var(--line-soft);
  padding:5px 4px; display:flex; flex-direction:column; gap:3px; transition:border-color .13s, background .13s}
.day.today{border-color:var(--accent-line); background:var(--accent-wash)}
.day.past{opacity:.62}
.day.drop{border-color:var(--accent); border-style:dashed; background:var(--accent-wash)}
.day .dn{font-family:var(--mono); font-size:11px; color:var(--ink-3); text-align:right; padding:0 3px; flex:none}
.day.today .dn{color:var(--accent); font-weight:600}
.day .av{font-size:8.5px; color:var(--ink-3); padding:0 3px; line-height:1.3; letter-spacing:.02em}
.blk{border-radius:6px; padding:4px 5px; font-size:10px; line-height:1.28; border-left:2.5px solid var(--accent);
  background:var(--surface-3); cursor:pointer; text-align:left; width:100%; transition:background .12s}
.blk:hover{background:var(--line)}
.blk .bt{display:block; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink)}
.blk .bm{display:block; color:var(--ink-3); font-family:var(--mono); font-size:9px; margin-top:1px}
.blk.done{border-left-color:var(--good); opacity:.92}
.blk.missed{border-left-color:var(--crit)}
.blk.rest{border-left-color:var(--ink-3)}
.blk[draggable="true"]{cursor:grab}
.blk.dragging{opacity:.4}
@media(max-width:640px){
  .cal{grid-template-columns:1fr; gap:6px}
  .cal .dh{display:none}
  .day{min-height:auto; flex-direction:column}
  .day .dn{text-align:left; font-size:12px; font-weight:600; color:var(--ink-2)}
}

/* ---------- RPE dial ---------- */
.rpe{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
@media(min-width:520px){.rpe{grid-template-columns:repeat(10,1fr)}}
.rpe button{aspect-ratio:1; border-radius:10px; border:1px solid var(--line); background:var(--surface-2);
  font-family:var(--mono); font-size:16px; font-weight:600; color:var(--ink-2); transition:.13s; min-height:44px}
.rpe button:hover{background:var(--surface-3)}
.rpe button.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.rpe-lb{display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-3); margin-top:5px}

/* ---------- body map ---------- */
.bmap{display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:6px}
.bmap button{padding:9px 8px; border-radius:9px; border:1px solid var(--line); background:var(--surface-2);
  font-size:12.5px; font-weight:600; text-align:left; color:var(--ink-2); transition:.13s; min-height:44px; line-height:1.3}
.bmap button:hover{background:var(--surface-3); color:var(--ink)}
.bmap button.on{border-color:var(--crit); background:var(--crit-wash); color:var(--crit)}

/* ---------- messages ---------- */
.thread{display:flex; flex-direction:column; gap:9px; padding:4px 0}
.msg{max-width:84%; padding:9px 12px; border-radius:13px; font-size:14px; line-height:1.45; word-break:break-word}
.msg.them{align-self:flex-start; background:var(--surface-2); border:1px solid var(--line-soft); border-bottom-left-radius:4px}
.msg.me{align-self:flex-end; background:var(--accent-wash); border:1px solid var(--accent-line); border-bottom-right-radius:4px}
.msg .who{font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); margin-bottom:3px}
.msg .tm{font-family:var(--mono); font-size:10px; color:var(--ink-3); margin-top:4px}
.msg .vid{display:flex; align-items:center; gap:7px; margin-top:6px; padding:7px 9px; border-radius:8px;
  background:var(--surface-3); border:1px solid var(--line); font-size:12px; color:var(--accent); font-weight:600}
.msg .vid svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;flex:none}
.msg video{width:100%; border-radius:8px; margin-top:6px; background:#000; display:block}

/* ---------- exercise cards ---------- */
.excard{padding:13px 14px; border-radius:var(--r); background:var(--surface); border:1px solid var(--line-soft);
  display:flex; flex-direction:column; gap:7px; text-align:left; width:100%; transition:border-color .14s, transform .1s}
button.excard:hover{border-color:var(--accent-line); transform:translateY(-1px)}
.excard .eh{display:flex; align-items:flex-start; gap:9px}
.excard .en{display:block; font-size:14.5px; font-weight:600; line-height:1.3; flex:1 1 auto; min-width:0}
.excard .ed{font-size:12.5px; color:var(--ink-2); line-height:1.5;
  display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.excard .em{display:flex; gap:5px; flex-wrap:wrap; margin-top:1px}
.lvdot{width:7px;height:7px;border-radius:50%;flex:none;margin-top:6px}

/* ---------- onboarding stepper ---------- */
.steps{display:flex; align-items:center; gap:0; margin-bottom:4px}
.steps .st{flex:1 1 0; height:3px; border-radius:99px; background:var(--surface-3); position:relative}
.steps .st+.st{margin-left:5px}
.steps .st.done{background:var(--accent)}
.steps .st.now{background:linear-gradient(90deg,var(--accent) 50%,var(--surface-3) 50%)}

/* ---------- gauge ---------- */
.gauge{width:100%; max-width:250px; margin:0 auto}
.gauge .rd{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding-top:14px}
.gauge .rd .v{font-family:var(--mono); font-size:33px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums}
.gauge .rd .l{font-size:10.5px; font-weight:600; letter-spacing:.11em; text-transform:uppercase; margin-top:5px}

/* ---------- test runner ---------- */
.timer{font-family:var(--mono); font-size:56px; font-weight:600; line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums; text-align:center}
.timer.work{color:var(--accent)} .timer.rest{color:var(--warn)}
.ring{width:172px; height:172px; margin:0 auto; position:relative}
.ring svg{transform:rotate(-90deg); display:block}
.ring .tr{fill:none; stroke:var(--surface-3); stroke-width:9}
.ring .pg{fill:none; stroke:var(--accent); stroke-width:9; stroke-linecap:round; transition:stroke-dashoffset .1s linear}
.ring .pg.rest{stroke:var(--warn)}
.ring .ct{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
.ring .ct .n{font-family:var(--mono); font-size:44px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums}
.ring .ct .p{font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); margin-top:5px}

/* ---------- print / export ---------- */
.wmark{display:none}
@media print{
  @page{margin:14mm}
  :root{--bg:#fff;--surface:#fff;--surface-2:#fff;--surface-3:#f4f6f9;--line:#c9d3e0;--line-soft:#e3e9f1;
    --ink:#0b1220;--ink-2:#3f4d68;--ink-3:#6b7a92;--accent:#0e5f75;--accent-ink:#fff;--accent-wash:#eef7fa;--accent-line:#a9d8e4;
    --good:#0b7a55;--warn:#96600a;--crit:#a83a30;--shadow:none;--shadow-sm:none}
  body{background:#fff!important}
  #app{background:#fff!important}
  .topbar,.tabs,#toasts,.noprint,footer.legal .noprint{display:none!important}
  main{max-width:none; padding:0}
  .panel{break-inside:avoid; border:1px solid #d5dde8}
  .wmark{display:block; position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
  .wmark span{position:absolute; font:600 13px var(--mono); color:rgba(11,18,32,.055); white-space:nowrap;
    transform:rotate(-32deg); transform-origin:0 0}
  .printonly{display:block!important}
}
.printonly{display:none}

/* --- test names & protocols --- */
"t.finger.n":   ["Force maximale de doigts (réglette 20 mm)", "Max Finger Strength (20 mm Edge)"],
"t.finger.p":   ["Suspension 7 secondes à deux bras sur réglette 20 mm, en demi-arqué, sur poutre type Beastmaker ou Progression. Chargez ou allégez jusqu'à ne pouvoir tenir que 7 s. 3 minutes de repos entre essais, 4 essais maximum.", "7-second two-arm hang on a 20 mm edge, half-crimp, on a Beastmaker or Progression style board. Load or assist until you can hold exactly 7 s. 3 minutes rest between attempts, 4 attempts maximum."],
"t.finger.m":   ["Masse totale (poids de corps + lest) exprimée en % du poids de corps.", "Total mass (body weight + added load) expressed as % of body weight."],
"t.finger.s":   ["Jamais sur doigts froids. Demi-arqué uniquement, jamais en arqué fermé. Arrêt immédiat à la moindre douleur de poulie.", "Never on cold fingers. Half-crimp only, never full crimp. Stop immediately at the slightest pulley pain."],
"t.repeat.n":   ["Endurance intermittente — Repeaters 7/3", "Intermittent Repeaters (7/3)"],
"t.repeat.p":   ["7 s d'effort / 3 s de repos sur réglette 20 mm à 60 % de la charge maximale mesurée, jusqu'à l'échec. Le compteur intégré rythme l'effort.", "7 s work / 3 s rest on a 20 mm edge at 60% of the measured maximum, to failure. The built-in metronome paces the effort."],
"t.repeat.m":   ["Nombre total de répétitions complètes avant échec.", "Total number of complete repetitions before failure."],
"t.repeat.s":   ["À réaliser au minimum 20 minutes après le test de force maximale, ou sur une séance distincte.", "Perform at least 20 minutes after the max strength test, or in a separate session."],
"t.pull.n":     ["Traction lestée maximale (1RM)", "Max Weighted Pull-Up (1RM)"],
"t.pull.p":     ["Traction complète menton au-dessus de la barre, prise pronation largeur d'épaules, sans élan. Montée progressive en charge, 3 minutes de repos entre essais.", "Full pull-up, chin above the bar, shoulder-width pronated grip, no kipping. Progressive loading, 3 minutes rest between attempts."],
"t.pull.m":     ["Ratio lest / masse corporelle, en %.", "Added load / body mass ratio, in %."],
"t.pull.s":     ["Échauffement des coudes obligatoire. Descente contrôlée sur 2 secondes minimum.", "Elbow warm-up mandatory. Controlled 2-second minimum lowering."],
"t.power.n":    ["Puissance & explosivité — traction explosive", "Power & Explosive Pull-Up"],
"t.power.p":    ["Traction explosive maximale depuis bras tendus, sans élan des jambes. Notez le point de contact le plus haut atteint contre la barre.", "Maximal explosive pull-up from a dead hang, no leg kip. Record the highest contact point reached against the bar."],
"t.power.m":    ["Hauteur de contact atteinte, convertie en index de puissance.", "Contact height reached, converted into a power index."],
"t.power.s":    ["Contre-indiqué en cas de gêne d'épaule ou de coude.", "Contraindicated with any shoulder or elbow niggle."],
"t.core.n":     ["Gainage & tension corporelle — Front Lever", "Core & Front Lever Hold"],
"t.core.p":     ["Maintien du front lever dans la variante la plus difficile tenue proprement : groupé, groupé avancé, écarté ou complet. Bassin en rétroversion, dos plat.", "Hold the front lever in the hardest variant held cleanly: tuck, advanced tuck, straddle or full. Posterior pelvic tilt, flat back."],
"t.core.m":     ["Secondes de maintien × coefficient de variante, plus évaluation de la stabilité lombaire.", "Seconds held × variant coefficient, plus lumbar stability assessment."],
"t.core.s":     ["Arrêt dès que le bassin bascule en antéversion ou que le dos se creuse.", "Stop as soon as the pelvis tilts anteriorly or the back arches."],
"t.mob.n":      ["Index de mobilité spécifique escalade", "Climbing Mobility Index"],
"t.mob.p":      ["Écart inter-chevilles maximal au mur, pieds à plat, bassin en contact. Puis rotation externe gléno-humérale mesurée à 90° d'abduction.", "Maximum inter-ankle spread at the wall, feet flat, hips in contact. Then gleno-humeral external rotation measured at 90° abduction."],
"t.mob.m":      ["Écart inter-chevilles normalisé par la taille (%) et amplitude de rotation externe (°).", "Inter-ankle spread normalized by height (%) and external rotation range (°)."],
"t.mob.s":      ["Progressif, jamais en balistique. Aucune douleur ne doit être ressentie.", "Progressive, never ballistic. No pain should be felt."],
"t.vol.n":      ["Volume de grimpe", "Climbing volume"],
"t.vol.p":      ["Déclaratif : nombre de séances hebdomadaires, durée moyenne, et ancienneté de pratique régulière.", "Self-reported: weekly sessions, average duration, and length of regular practice."],
"t.vol.m":      ["Heures de grimpe par semaine et régularité.", "Climbing hours per week and consistency."],
"t.vol.s":      ["Aucun risque. La progression d'un débutant vient d'abord du volume, pas de la charge.", "No risk. A beginner's progress comes from volume first, not load."],
"t.eff.n":      ["Efficience gestuelle", "Movement efficiency"],
"t.eff.p":      ["Test des pieds silencieux sur une voie deux niveaux sous votre maximum : 20 poses de pied consécutives. Comptez les poses bruyantes ou repositionnées. Puis test de fluidité : temps d'immobilité cumulé sur un bloc connu.", "Silent feet test on a route two grades below your maximum: 20 consecutive foot placements. Count noisy or repositioned placements. Then a flow test: cumulative motionless time on a known problem."],
"t.eff.m":      ["Taux de poses de pied propres (%) et ratio temps de mouvement / temps total.", "Clean foot placement rate (%) and movement time / total time ratio."],
"t.eff.s":      ["Aucun risque. C'est le levier de progression le plus rentable à ce niveau.", "No risk. It is the highest-return progress lever at this level."],
"t.joint.n":    ["Historique et tolérance articulaire", "Joint history and tolerance"],
"t.joint.p":    ["Inventaire structuré des épisodes douloureux passés et présents : doigts, coudes, épaules, poignets, dos, genoux. Test de tolérance : 10 s de suspension à deux bras sur grosse prise, ressenti noté.", "Structured inventory of past and present painful episodes: fingers, elbows, shoulders, wrists, back, knees. Tolerance test: 10 s two-arm hang on a large hold, sensation recorded."],
"t.joint.m":    ["Score de risque articulaire et tolérance à la suspension.", "Joint risk score and hang tolerance."],
"t.joint.s":    ["Suspension sur grosse prise uniquement, jamais sur réglette à ce stade.", "Hang on a large hold only, never on an edge at this stage."],
"t.basemob.n":  ["Mobilité fondamentale", "Foundational mobility"],
"t.basemob.p":  ["Trois mesures : écart inter-chevilles au mur, flexion d'épaule au mur (bras tendus, lombaires plaquées), et dorsiflexion de cheville au mur (genou-mur).", "Three measures: inter-ankle spread at the wall, shoulder flexion at the wall (arms straight, lumbar flat), and ankle dorsiflexion at the wall (knee-to-wall)."],

"t.baseend.n":  ["Endurance de base", "Base endurance"],
"t.baseend.p":  ["Traversée continue sur prises confortables à intensité modérée, jusqu'à devoir descendre. Ou nombre de longueurs enchaînées deux niveaux sous votre maximum.", "Continuous traverse on comfortable holds at moderate intensity, until you must come down. Or number of laps two grades below your maximum."],

"t.basecore.n": ["Gainage fondamental", "Foundational core"],

<script>
/* ================================================================
   2. PERSISTENCE LAYER
   Shared artifact database when granted, with a local write-behind
   cache so entries made at the wall survive a dropped connection.
   ================================================================ */
const COLS = ["users", "assessments", "sessions", "pain", "threads", "routines", "config", "audit"];
const LS_KEY = "altaris.cache.v1";
const LS_Q   = "altaris.queue.v1";

const Store = {
  db: null,
  mode: "local",            // "cloud" | "local"
  ready: false,
  data: {},                 // col -> { id -> doc }
  queue: [],                // pending writes when cloud is unreachable
  subs: [],
  silent: false,
  _flushing: false,

  _blank(){ const o = {}; COLS.forEach(c => o[c] = {}); return o; },

  loadLocal(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      this.data = raw ? Object.assign(this._blank(), JSON.parse(raw)) : this._blank();
      const q = localStorage.getItem(LS_Q);
      this.queue = q ? JSON.parse(q) : [];
    }catch(e){ this.data = this._blank(); this.queue = []; }
  },
  saveLocal(){
    try{
      localStorage.setItem(LS_KEY, JSON.stringify(this.data));
      localStorage.setItem(LS_Q, JSON.stringify(this.queue));
    }catch(e){ /* storage full or blocked — cloud remains the source of truth */ }
  },

  async init(){
    this.loadLocal();
    this.ready = true;
    render();                                   // paint immediately from cache
    let db = null;
    try{ db = await claude.use("db"); }catch(e){ db = null; }
    if (!db){ this.mode = "local"; render(); return; }
    this.db = db; this.mode = "cloud";
    COLS.forEach(col => {
      try{
        db.collection(col).onSnapshot(
          snap => {
            const next = {};
            snap.docs.forEach(d => { const v = d.data(); if (v) next[d.id] = Object.assign({ id: d.id }, v); });
            this.data[col] = next;
            this.saveLocal();
            if (!this.silent) render();
          },
          err => {
            if (err && (err.code === "revoked" || err.code === "not_granted")) this.mode = "local";
            render();
          }
        );
      }catch(e){ /* malformed path is a programming error; nothing to recover at runtime */ }
    });
    this.flush();
    render();
  },

  list(col){ return Object.values(this.data[col] || {}); },
  get(col, id){ return (this.data[col] || {})[id] || null; },

  /** Write a whole document. Optimistic locally, queued if the cloud refuses. */
  async put(col, id, obj){
    const doc = Object.assign({}, obj, { id: id });
    this.data[col] = this.data[col] || {};
    this.data[col][id] = doc;
    this.saveLocal();
    if (!this.silent) render();
    if (this.mode !== "cloud" || !this.db){ this._enqueue({ op:"set", col, id, doc }); return true; }
    try{
      const body = Object.assign({}, doc); delete body.id;
      await this.db.doc(col + "/" + id).set(body);
      return true;
    }catch(e){
      if (e && e.code === "quota_exceeded"){ toast(t("er.quota"), "crit"); return false; }
      if (e && e.code === "invalid_argument"){ toast(t("er.saveFailed"), "crit"); return false; }
      this._enqueue({ op:"set", col, id, doc });
      toast(t("er.offline"));
      return true;
    }
  },

  async del(col, id){
    if (this.data[col]) delete this.data[col][id];
    this.saveLocal();
    render();
    if (this.mode !== "cloud" || !this.db){ this._enqueue({ op:"del", col, id }); return; }
    try{ await this.db.doc(col + "/" + id).delete(); }
    catch(e){ this._enqueue({ op:"del", col, id }); }
  },

  _enqueue(item){
    this.queue = this.queue.filter(q => !(q.col === item.col && q.id === item.id));
    this.queue.push(item);
    this.saveLocal();
  },

  async flush(){
    if (this._flushing || this.mode !== "cloud" || !this.db || !this.queue.length) return;
    this._flushing = true;
    const pending = this.queue.slice();
    for (const item of pending){
      try{
        if (item.op === "del") await this.db.doc(item.col + "/" + item.id).delete();
        else { const b = Object.assign({}, item.doc); delete b.id; await this.db.doc(item.col + "/" + item.id).set(b); }
        this.queue = this.queue.filter(q => q !== item);
      }catch(e){ break; }
    }
    this.saveLocal();
    this._flushing = false;
    if (pending.length && !this.queue.length){ toast(t("er.synced"), "good"); render(); }
  }
};
setInterval(() => Store.flush(), 12000);
window.addEventListener("online", () => Store.flush());

/* ---------------- audit log (one document per month) ---------------- */
async function audit(action, detail){
  const key = new Date().toISOString().slice(0, 7);            // YYYY-MM
  const cur = Store.get("audit", key) || { id: key, entries: [] };
  const entries = (cur.entries || []).slice(-299);
  entries.push({
    ts: Date.now(),
    actor: (Session.user && Session.user.id) || "anon",
    actorName: (Session.user && Session.user.name) || "—",
    role: (Session.user && Session.user.role) || "—",
    action: action,
    detail: detail || ""
  });
  await Store.put("audit", key, { entries });
}

/* ---------------- global configuration ---------------- */
const DEFAULT_CONFIG = {
  acwrLow: 0.8, acwrHigh: 1.3, acwrCrit: 1.5,
  monoHigh: 2.0, testValidityDays: 84, painAlert: 4,
  thresholdSport: "7a", thresholdBoulder: "V6", acwrMethod: "ra"
};
function config(){ return Object.assign({}, DEFAULT_CONFIG, Store.get("config", "global") || {}); }

/* ---------------- session (who is signed in on this device) ---------------- */
const Session = {
  user: null,
  restore(){
    try{
      const id = localStorage.getItem("altaris.session");
      if (!id) return;
      const u = Store.get("users", id);
      if (u && u.status !== "suspended") this.user = u;
    }catch(e){}
  },
  signIn(u){
    this.user = u;
    try{ localStorage.setItem("altaris.session", u.id); }catch(e){}
    touch(u.id);
    audit("sign_in", u.role);
  },
  signOut(){
    audit("sign_out", "");
    this.user = null;
    try{ localStorage.removeItem("altaris.session"); }catch(e){}
    View.tab = null; render();
  },
  /** Always read the live document, not the snapshot taken at sign-in. */
  live(){ return this.user ? (Store.get("users", this.user.id) || this.user) : null; }
};
function touch(userId){
  const u = Store.get("users", userId);
  if (!u) return;
  const p = Object.assign({}, u.profile || {}, { lastActive: Date.now() });
  Store.put("users", userId, Object.assign({}, u, { profile: p }));
}

/* ---------------- RBAC ---------------- */
const Access = {
  /** Climbers visible to the signed-in user. */
  climbers(){
    const me = Session.live(); if (!me) return [];
    const all = Store.list("users").filter(u => u.role === "climber" && u.status !== "suspended");
    if (me.role === "admin") return all;
    if (me.role === "coach")  return all.filter(u => u.coachId === me.id);
    return all.filter(u => u.id === me.id);
  },
  canSee(userId){
    const me = Session.live(); if (!me) return false;
    if (me.id === userId) return true;
    if (me.role === "admin") return true;
    if (me.role === "coach"){ const u = Store.get("users", userId); return !!u && u.coachId === me.id; }
    return false;
  },
  /** Rows of a collection the signed-in user is allowed to read. */
  scoped(col){ return Store.list(col).filter(r => this.canSee(r.userId)); },
  myCoach(){
    const me = Session.live();
    return me && me.coachId ? Store.get("users", me.coachId) : null;
  }
};

/* ---------------- grade scales ---------------- */
const SPORT = ["4","5a","5b","5c","6a","6a+","6b","6b+","6c","6c+","7a","7a+","7b","7b+","7c","7c+","8a","8a+","8b","8b+","8c","8c+","9a","9a+","9b"];
const FONT  = ["4","5","5+","6A","6A+","6B","6B+","6C","6C+","7A","7A+","7B","7B+","7C","7C+","8A","8A+","8B","8B+","8C","8C+","9A"];
const FONT_V = { "4":"V0","5":"V1","5+":"V2","6A":"V3","6A+":"V4","6B":"V4","6B+":"V5","6C":"V5","6C+":"V6","7A":"V6","7A+":"V7","7B":"V8","7B+":"V9","7C":"V9","7C+":"V10","8A":"V11","8A+":"V12","8B":"V13","8B+":"V14","8C":"V15","8C+":"V16","9A":"V17" };
const fontLabel = (f) => f ? f + " / " + (FONT_V[f] || "") : "—";
const THRESHOLD_SPORT_IDX = SPORT.indexOf("7a");
const THRESHOLD_FONT_IDX  = FONT.indexOf("7A");

/**
 * CDC §4 routing rule: maximum level after working the route or problem.
 * Advanced/Expert requires ≥ 7a sport OR ≥ 7A Font (≈ V6).
 */
function trackFor(profile){
  if (!profile) return "beginner";
  const s = SPORT.indexOf(profile.gradeSport || "");
  const b = FONT.indexOf(profile.gradeBoulder || "");
  const adv = (s >= 0 && s >= THRESHOLD_SPORT_IDX) || (b >= 0 && b >= THRESHOLD_FONT_IDX);
  return adv ? "advanced" : "beginner";
}

/* ---------------- piecewise-linear normalization ---------------- */
/** anchors: [[value, score], …] ascending by value. Returns 0–100. */
function interp(anchors, v){
  if (v == null || isNaN(v)) return null;
  if (v <= anchors[0][0]) return Math.max(0, anchors[0][1] * (v / (anchors[0][0] || 1)));
  for (let i = 0; i < anchors.length - 1; i++){
    const [x0, y0] = anchors[i], [x1, y1] = anchors[i+1];
    if (v <= x1) return y0 + (y1 - y0) * ((v - x0) / (x1 - x0));
  }
  const last = anchors[anchors.length - 1];
  return Math.min(100, last[1] + (v - last[0]) * 0.15);
}

const batteryFor = (track) => Object.values(TESTS).filter(x => x.track === track);
const DOMAIN_ORDER = {
  advanced: ["finger", "endurance", "pull", "power", "core", "mobility"],
  beginner: ["volume", "technique", "endurance", "core", "mobility", "resilience"]
};

/* ---------------- scoring bands ---------------- */
function band(score){
  if (score == null) return { k:"g.noData", cls:"" };
  if (score < 35) return { k:"b.developing", cls:"crit" };
  if (score < 60) return { k:"b.solid",      cls:"warn" };
  if (score < 82) return { k:"b.strong",     cls:"good" };
  return              { k:"b.elite",      cls:"acc" };
}

/** Recompute every domain score for one assessment. */
function scoreAssessment(a, profile){
  const scores = {};
  Object.keys(a.results || {}).forEach(k => {
    const test = TESTS[k]; const r = a.results[k];
    if (!test || !r || r.skipped) return;
    const s = test.score(r, profile);
    if (s != null && !isNaN(s)) scores[test.domain] = clamp(round(s, 1), 0, 100);
  });
  return scores;
}
function latestAssessment(userId){
  const list = Store.list("assessments").filter(a => a.userId === userId && a.status === "complete");
  list.sort((x, y) => (x.date < y.date ? 1 : -1));
  return list[0] || null;
}
function assessmentsOf(userId){
  const list = Store.list("assessments").filter(a => a.userId === userId);
  list.sort((x, y) => (x.date < y.date ? 1 : -1));
  return list;
}
/** Lowest and highest scored domain of the most recent assessment. */
function limiters(userId){
  const a = latestAssessment(userId);
  if (!a || !a.scores) return null;
  const rows = Object.entries(a.scores);
  if (rows.length < 3) return null;
  rows.sort((x, y) => x[1] - y[1]);
  return { weak: rows[0], strong: rows[rows.length - 1] };
}

/* ================================================================
   4. WORKLOAD ANALYTICS — session load, ACWR, monotony, strain
   CDC §5. Load = RPE × duration (Foster session-RPE, arbitrary units).
   ================================================================ */
const sessionLoad = (rpe, minutes) => (rpe > 0 && minutes > 0) ? Math.round(rpe * minutes) : 0;

/** Map of ISO date -> total load, from validated sessions only. */
function dailyLoads(userId){
  const m = {};
  Store.list("sessions")
    .filter(s => s.userId === userId && s.status === "done" && s.load > 0)
    .forEach(s => { m[s.date] = (m[s.date] || 0) + s.load; });
  return m;
}
function loadSeries(userId, days, endDate){
  const end = endDate || today();
  const m = dailyLoads(userId);
  const out = [];
  for (let i = days - 1; i >= 0; i--){
    const d = addDays(end, -i);
    out.push({ date: d, load: m[d] || 0 });
  }
  return out;
}
function firstLoadDate(userId){
  const ds = Object.keys(dailyLoads(userId)).sort();
  return ds[0] || null;
}

/**
 * Acute:Chronic Workload Ratio.
 * method "ra"  : acute = Σ 7 d, chronic = Σ 28 d ÷ 4  (Gabbett rolling average)
 * method "ewma": exponentially weighted moving averages, λ = 2/(N+1)
 * Returns null while fewer than 28 days of history exist — the ratio is not
 * interpretable before then, and showing one anyway would be misleading.
 */
function computeACWR(userId, method, endDate){
  const end = endDate || today();
  const cfg = config();
  const m = method || cfg.acwrMethod || "ra";
  const first = firstLoadDate(userId);
  const history = first ? diffDays(end, first) + 1 : 0;
  const series = loadSeries(userId, 28, end);
  const acute = sum(series.slice(-7).map(x => x.load));
  const chronic = sum(series.map(x => x.load)) / 4;

  let ratio = null;
  if (history >= 28 && chronic > 0){
    if (m === "ewma"){
      const la = 2 / (7 + 1), lc = 2 / (28 + 1);
      let ea = 0, ec = 0;
      loadSeries(userId, Math.max(history, 28), end).forEach(d => {
        ea = d.load * la + ea * (1 - la);
        ec = d.load * lc + ec * (1 - lc);
      });
      ratio = ec > 0 ? ea / ec : null;
    } else {
      ratio = acute / chronic;
    }
  }
  const daysLogged = series.filter(x => x.load > 0).length;
  return { acute, chronic: Math.round(chronic), ratio: ratio == null ? null : round(ratio, 2),
           history, daysLogged, method: m, series };
}
function acwrZone(ratio){
  const c = config();
  if (ratio == null) return { key:"ld.insufficient", cls:"" };
  if (ratio < c.acwrLow)  return { key:"ld.zone.under",   cls:"warn" };
  if (ratio <= c.acwrHigh) return { key:"ld.zone.optimal", cls:"good" };
  if (ratio <= c.acwrCrit) return { key:"ld.zone.caution", cls:"warn" };
  return { key:"ld.zone.high", cls:"crit" };
}
/** Foster monotony (7 d) and strain. */
function monotonyStrain(userId, endDate){
  const s = loadSeries(userId, 7, endDate).map(x => x.load);
  const weekly = sum(s);
  const mean = weekly / 7;
  const sd = Math.sqrt(sum(s.map(x => (x - mean) * (x - mean))) / 7);
  if (weekly === 0) return { monotony: null, strain: null, weekly: 0 };
  const mono = sd > 0 ? mean / sd : null;
  return { monotony: mono == null ? null : round(mono, 2),
           strain: mono == null ? null : Math.round(weekly * mono),
           weekly: weekly };
}

/* ---------------- coach-side alerting ---------------- */
function alertsFor(userId){
  const cfg = config(), out = [];
  const activePain = Store.list("pain").filter(p => p.userId === userId && p.status === "active");
  const worst = activePain.reduce((a, p) => Math.max(a, p.eva || 0), 0);
  if (activePain.length){
    out.push({ k:"co.alertPain", sev: worst >= cfg.painAlert ? "crit" : "warn",
               d: activePain.length + " · " + t("pn.eva") + " " + worst + "/10" });
  }
  const a = computeACWR(userId);
  if (a.ratio != null){
    const z = acwrZone(a.ratio);
    if (z.cls === "crit" || z.cls === "warn")
      out.push({ k:"co.alertAcwr", sev: z.cls, d: "ACWR " + a.ratio.toFixed(2) + " · " + t(z.key) });
  }
  const missed = Store.list("sessions").filter(s =>
    s.userId === userId && s.status === "missed" && diffDays(today(), s.date) <= 14).length;
  if (missed >= 2) out.push({ k:"co.alertMissed", sev:"warn", d: missed + " / 14 " + t("g.days") });

  const u = Store.get("users", userId);
  const last = u && u.profile && u.profile.lastActive;
  if (last && (Date.now() - last) > 12 * 86400000)
    out.push({ k:"co.alertStale", sev:"warn", d: Math.round((Date.now() - last) / 86400000) + " " + t("g.days") });

  const la = latestAssessment(userId);
  if (!la) out.push({ k:"co.alertTest", sev:"warn", d: t("ts.noTests") });
  else if (diffDays(today(), la.date) > cfg.testValidityDays)
    out.push({ k:"co.alertTest", sev:"warn", d: relDays(la.date) });
  return out;
}
/** Any active pain on load-bearing structures blocks maximal tests. */
function maxLoadBlocked(userId){
  const blocking = ["finger_a2", "finger_a4", "finger_other", "elbow_med", "elbow_lat", "shoulder", "wrist"];
  return Store.list("pain").some(p => p.userId === userId && p.status === "active" && blocking.indexOf(p.location) >= 0);
}

/** Hexagonal radar of normalized 0–100 domain scores. */
function radarChart(domains, series, opts){
  const o = opts || {};
  const W = 340, H = 300, cx = W/2, cy = H/2 + 4, R = 96;
  const n = domains.length;
  if (!n) return "";
  const ang = i => (Math.PI * 2 * i / n) - Math.PI / 2;
  const pt = (i, v) => [cx + Math.cos(ang(i)) * R * (v/100), cy + Math.sin(ang(i)) * R * (v/100)];
  let g = "";
  [20,40,60,80,100].forEach(lv => {
    const p = domains.map((_, i) => pt(i, lv).join(",")).join(" ");
    g += '<polygon points="' + p + '" fill="none" class="gridln' + (lv===100?" b":"") + '"/>';
  });
  domains.forEach((_, i) => {
    const [x,y] = pt(i, 100);
    g += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x + '" y2="' + y + '" class="gridln"/>';
  });
  g += '<text x="' + (cx+3) + '" y="' + (cy - R + 10) + '" class="ax" text-anchor="start">100</text>';
  g += '<text x="' + (cx+3) + '" y="' + (cy - R*0.5 + 10) + '" class="ax" text-anchor="start">50</text>';

  let sh = "";
  series.forEach((s, si) => {
    const pts = domains.map((d, i) => pt(i, s.values[d] == null ? 0 : s.values[d]));

    sh += '<polygon points="' + poly + '" fill="' + s.color + '" fill-opacity="' + (si===0 ? .17 : .07) + '" stroke="' + s.color +
          '" stroke-width="2" stroke-linejoin="round"' + (s.dash ? ' stroke-dasharray="5 4"' : '') + '/>';
    if (!s.dash) pts.forEach((p, i) => {
      const v = s.values[domains[i]];
      if (v == null) return;
      sh += '<circle cx="' + round(p[0],1) + '" cy="' + round(p[1],1) + '" r="4.5" fill="' + s.color + '" stroke="var(--surface)" stroke-width="2"/>';
    });
  });
  let lb = "";
  domains.forEach((d, i) => {
    const a = ang(i), lx = cx + Math.cos(a) * (R + 30), ly = cy + Math.sin(a) * (R + 30);
    const anchor = Math.abs(Math.cos(a)) < 0.25 ? "middle" : (Math.cos(a) > 0 ? "start" : "end");
    const v = series[0].values[d];
    lb += '<text x="' + round(lx,1) + '" y="' + round(ly,1) + '" class="axl" text-anchor="' + anchor + '">' + esc(t("d."+d)) + '</text>';
    lb += '<text x="' + round(lx,1) + '" y="' + round(ly+13,1) + '" class="ax" text-anchor="' + anchor + '" style="font-size:11px;fill:' +
          (v == null ? "var(--ink-3)" : series[0].color) + '">' + (v == null ? "—" : Math.round(v)) + '</text>';
  });
  const legend = series.length > 1
    ? '<div class="legend" style="margin-top:8px;justify-content:center">' + series.map(s =>
        '<span><i class="' + (s.dash ? "ln" : "") + '" style="background:' + s.color + '"></i>' + esc(s.label) + '</span>').join("") + '</div>'
    : "";
  return '<div class="chartbox" style="max-width:440px;margin:0 auto"><svg viewBox="-34 -14 ' + (W+68) + ' ' + (H+28) +
         '" role="img" aria-label="' + esc(o.alt || t("ov.profile")) + '">' + g + sh + lb + '</svg></div>' + legend;
}

/** Per-day ACWR history, computed from one pass over the load map. */
function acwrSeries(userId, days, method){
  const m = dailyLoads(userId);
  const cfg = config();
  const meth = method || cfg.acwrMethod || "ra";
  const first = firstLoadDate(userId);
  const out = [];
  const la = 2/(7+1), lc = 2/(28+1);
  let ea = 0, ec = 0;
  const start = addDays(today(), -(days + 40));
  const ewma = {};
  for (let d = start; diffDays(today(), d) >= 0; d = addDays(d, 1)){
    const L = m[d] || 0;
    ea = L * la + ea * (1 - la);
    ec = L * lc + ec * (1 - lc);
    ewma[d] = ec > 0 ? ea / ec : null;
  }
  for (let i = days - 1; i >= 0; i--){
    const d = addDays(today(), -i);
    const hist = first ? diffDays(d, first) + 1 : 0;
    let ratio = null;
    if (hist >= 28){
      if (meth === "ewma") ratio = ewma[d];
      else {
        let a = 0, c = 0;
        for (let k = 0; k < 28; k++){ const dd = addDays(d, -k); const L = m[dd] || 0; c += L; if (k < 7) a += L; }
        ratio = c > 0 ? a / (c/4) : null;
      }
    }
    out.push({ date: d, load: m[d] || 0, ratio: ratio });
  }
  return out;
}

/**
 * Workload chart. Two stacked panels sharing one time axis — daily load in
 * arbitrary units above, the unitless ratio below. Deliberately NOT a
 * dual-axis chart: the two measures have incompatible scales.
 */
function workloadChart(series){
  const cfg = config();
  const W = 720, PL = 40, PR = 12, PT = 10;
  const HA = 118, GAP = 34, HB = 104;
  const H = PT + HA + GAP + HB + 26;
  const n = series.length;
  const iw = W - PL - PR;
  const bw = Math.max(2, (iw / n) - 2);
  const maxLoad = Math.max(100, ...series.map(d => d.load));
  const tick = maxLoad <= 300 ? 100 : maxLoad <= 800 ? 200 : maxLoad <= 1600 ? 400 : 800;
  const yA = v => PT + HA - (v / maxLoad) * HA;
  const id = "wc" + (++_tipSeq);

  let g = "";
  for (let v = 0; v <= maxLoad; v += tick){
    g += '<line x1="' + PL + '" y1="' + round(yA(v),1) + '" x2="' + (W-PR) + '" y2="' + round(yA(v),1) + '" class="gridln"/>';
    g += '<text x="' + (PL-7) + '" y="' + round(yA(v)+3.5,1) + '" class="ax" text-anchor="end">' + v + '</text>';
  }
  let bars = "";
  series.forEach((d, i) => {
    if (d.load <= 0) return;
    const x = PL + (iw / n) * i + 1, h = Math.max(2, PT + HA - yA(d.load));
    const r = Math.min(4, bw/2, h);
    bars += '<path d="M' + round(x,1) + ' ' + round(PT+HA,1) + ' v' + round(-(h-r),1) +
            ' a' + r + ' ' + r + ' 0 0 1 ' + r + ' ' + (-r) + ' h' + round(bw-2*r,1) +
            ' a' + r + ' ' + r + ' 0 0 1 ' + r + ' ' + r + ' v' + round(h-r,1) + 'Z" fill="var(--accent)" fill-opacity=".8"/>';
  });

  const yB0 = PT + HA + GAP;
  const maxR = Math.max(2.0, Math.ceil(Math.max(0, ...series.map(d => d.ratio || 0)) * 1.12 * 2) / 2);
  const yB = v => yB0 + HB - (v / maxR) * HB;
  let zones = "";
  const zb = [[0, cfg.acwrLow, "var(--warn)", .07], [cfg.acwrLow, cfg.acwrHigh, "var(--good)", .17],
              [cfg.acwrHigh, cfg.acwrCrit, "var(--warn)", .14], [cfg.acwrCrit, maxR, "var(--crit)", .16]];
  zb.forEach(z => {
    const y1 = yB(Math.min(z[1], maxR)), y2 = yB(z[0]);
    if (y2 - y1 <= 0) return;
    zones += '<rect x="' + PL + '" y="' + round(y1,1) + '" width="' + iw + '" height="' + round(y2-y1,1) + '" fill="' + z[2] + '" opacity="' + z[3] + '"/>';
  });
  [cfg.acwrLow, cfg.acwrHigh, cfg.acwrCrit].forEach(v => {
    if (v > maxR) return;
    zones += '<line x1="' + PL + '" y1="' + round(yB(v),1) + '" x2="' + (W-PR) + '" y2="' + round(yB(v),1) +
             '" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"/>';
    zones += '<text x="' + (PL-7) + '" y="' + round(yB(v)+3.5,1) + '" class="ax" text-anchor="end">' + v.toFixed(1) + '</text>';
  });
  zones += '<text x="' + (PL-7) + '" y="' + round(yB(0)+3.5,1) + '" class="ax" text-anchor="end">0</text>';
  zones += '<text x="' + (PL-7) + '" y="' + round(yB(maxR)+3.5,1) + '" class="ax" text-anchor="end">' + maxR.toFixed(1) + '</text>';

  let path = "", last = null, dots = "";
  series.forEach((d, i) => {
    const x = PL + (iw / n) * i + (iw/n)/2;
    if (d.ratio == null){ last = null; return; }
    const y = yB(d.ratio);
    path += (last === null ? "M" : "L") + round(x,1) + " " + round(y,1);
    last = i;
  });
  const lastPt = series.map((d,i) => ({d,i})).filter(o => o.d.ratio != null).pop();
  if (lastPt){
    const x = PL + (iw/n) * lastPt.i + (iw/n)/2, y = yB(lastPt.d.ratio);
    const z = acwrZone(lastPt.d.ratio);
    const col = z.cls === "good" ? "var(--good)" : z.cls === "crit" ? "var(--crit)" : z.cls === "warn" ? "var(--warn)" : "var(--accent)";
    dots = '<circle cx="' + round(x,1) + '" cy="' + round(y,1) + '" r="5" fill="' + col + '" stroke="var(--surface)" stroke-width="2"/>' +
           '<text x="' + round(Math.min(x + 9, W - PR - 26),1) + '" y="' + round(y - 9,1) + '" class="ax" style="font-size:11px;font-weight:600;fill:' + col +
           '">' + lastPt.d.ratio.toFixed(2) + '</text>';
  }

  let xlab = "";
  const step = Math.max(1, Math.round(n / 6));
  series.forEach((d, i) => {
    if (i % step !== 0 && i !== n-1) return;
    const x = PL + (iw/n) * i + (iw/n)/2;
    xlab += '<text x="' + round(x,1) + '" y="' + (H-6) + '" class="ax" text-anchor="middle">' + esc(fmtDate(d.date, {day:"2-digit",month:"2-digit"})) + '</text>';
  });

  let hit = "";
  series.forEach((d, i) => {
    const x = PL + (iw/n) * i;
    hit += '<rect x="' + round(x,1) + '" y="0" width="' + round(iw/n,2) + '" height="' + (PT+HA+GAP+HB) + '" fill="transparent" ' +
           'data-i="' + i + '" data-d="' + d.date + '" data-load="' + d.load + '" data-r="' + (d.ratio == null ? "" : d.ratio.toFixed(2)) + '"/>';
  });

  return '<div class="chartbox wide" id="' + id + '">' +
    '<div class="row tight" style="margin-bottom:2px"><span class="eyebrow">' + esc(t("ld.dailyLoad")) + ' · ' + esc(t("ld.au")) + '</span></div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(t("ld.chart")) + '">' +
      g + bars +
      '<text x="' + PL + '" y="' + (yB0 - 9) + '" class="axl">' + esc(t("ld.acwr")) + '</text>' +
      zones +
      '<path d="' + path + '" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      dots + xlab + hit +
    '</svg><div class="ctip" data-tip></div></div>';
}

/** Small inline sparkline of daily load — used in fleet rows. */
function sparkline(series, w, h){
  const W = w || 84, H = h || 24;
  const max = Math.max(1, ...series.map(d => d.load));
  const n = series.length;
  let bars = "";
  series.forEach((d, i) => {
    const bw = Math.max(1.2, (W/n) - 1.1);
    const bh = (d.load / max) * (H - 2);
    bars += '<rect x="' + round((W/n)*i,1) + '" y="' + round(H - bh,1) + '" width="' + round(bw,1) + '" height="' + round(Math.max(bh, d.load ? 1.5 : 0),1) +
            '" rx="1" fill="var(--accent)" fill-opacity="' + (d.load ? .75 : 0) + '"/>';
  });
  return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true" style="display:block">' + bars + '</svg>';
}

/** ACWR gauge — a 220° arc with the risk zones drawn behind the needle. */
function acwrGauge(ratio){
  const cfg = config();
  const W = 240, H = 148, cx = 120, cy = 126, R = 84, SW = 12;
  const maxR = 2.0;
  const toA = v => 180 + (clamp(v, 0, maxR) / maxR) * 180;          // degrees, clockwise from left
  const P = (a, r) => [cx + Math.cos(a * Math.PI/180) * r, cy + Math.sin(a * Math.PI/180) * r];
  const arc = (v0, v1, col, op) => {
    const a0 = toA(v0), a1 = toA(v1);
    if (a1 - a0 < 0.4) return "";
    const [x0,y0] = P(a0, R), [x1,y1] = P(a1, R);
    return '<path d="M' + round(x0,1) + ' ' + round(y0,1) + ' A' + R + ' ' + R + ' 0 ' + ((a1-a0) > 180 ? 1 : 0) + ' 1 ' +
           round(x1,1) + ' ' + round(y1,1) + '" fill="none" stroke="' + col + '" stroke-width="' + SW + '" opacity="' + (op||1) + '"/>';
  };
  /* zone track — the optimal band carries the colour, the rest stays recessive */
  let g = arc(0, cfg.acwrLow, "var(--warn)", .40) + arc(cfg.acwrLow, cfg.acwrHigh, "var(--good)", .95) +
          arc(cfg.acwrHigh, cfg.acwrCrit, "var(--warn)", .85) + arc(cfg.acwrCrit, maxR, "var(--crit)", .9);
  /* every tick names a value the dial reaches, placed outside the track */
  [0, cfg.acwrLow, cfg.acwrHigh, cfg.acwrCrit, maxR].forEach(v => {
    const a = toA(v), [x1,y1] = P(a, R + SW/2), [x2,y2] = P(a, R + SW/2 + 4);
    g += '<line x1="' + round(x1,1) + '" y1="' + round(y1,1) + '" x2="' + round(x2,1) + '" y2="' + round(y2,1) + '" stroke="var(--line)" stroke-width="1"/>';
    const [tx,ty] = P(a, R + SW/2 + 13);
    const anchor = v === 0 ? "start" : v === maxR ? "end" : "middle";
    g += '<text x="' + round(tx,1) + '" y="' + round(ty + (v === 0 || v === maxR ? 4 : 0),1) + '" class="ax" text-anchor="' + anchor + '">' +
         (v === maxR ? "2.0+" : v.toFixed(1)) + '</text>';
  });
  const z = acwrZone(ratio);
  const col = ratio == null ? "var(--ink-3)" : (z.cls === "good" ? "var(--good)" : z.cls === "crit" ? "var(--crit)" : "var(--warn)");
  if (ratio != null){
    const [mx,my] = P(toA(ratio), R);
    g += '<circle cx="' + round(mx,1) + '" cy="' + round(my,1) + '" r="8.5" fill="var(--surface)"/>' +
         '<circle cx="' + round(mx,1) + '" cy="' + round(my,1) + '" r="5.5" fill="' + col + '"/>';
  }
  /* readout sits in the dial opening, clear of the track and the ticks */
  g += '<text x="' + cx + '" y="' + (cy - 26) + '" text-anchor="middle" fill="' + col +
       '" style="font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:-.02em">' + (ratio == null ? "—" : ratio.toFixed(2)) + '</text>';
  g += '<text x="' + cx + '" y="' + (cy - 8) + '" text-anchor="middle" fill="' + col +
       '" style="font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase">' + esc(t(z.key)) + '</text>';
  return '<div class="gauge"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="ACWR ' + (ratio == null ? "—" : ratio.toFixed(2)) + '">' + g + '</svg></div>';
}

/** Horizontal bars: load distribution by session type. */
function typeBars(rows){
  if (!rows.length) return "";
  const max = Math.max(...rows.map(r => r.v));
  const S = ["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)"];
  return '<div class="stack sm">' + rows.map((r, i) =>
    '<div class="row nowrap" style="gap:9px">' +
      '<span style="width:84px;flex:0 0 auto;font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(r.k) + '</span>' +
      '<span style="flex:1 1 20px;min-width:0;height:9px;background:var(--surface-3);border-radius:99px;overflow:hidden;display:block">' +
        '<i style="display:block;height:100%;width:' + round((r.v/max)*100,1) + '%;background:' + S[i % 6] + ';border-radius:99px"></i></span>' +
      '<span class="num" style="width:52px;text-align:right;flex:0 0 auto;font-size:12.5px">' + fmtNum(r.v) + '</span>' +
    '</div>').join("") + '</div>';
}

/** Progress of one domain across successive assessments. */
function progressLines(assessments, domains){
  const list = assessments.slice().reverse().filter(a => a.status === "complete");
  if (list.length < 2) return "";
  const W = 660, H = 190, PL = 34, PR = 96, PT = 12, PB = 26;
  const iw = W - PL - PR, ih = H - PT - PB;
  const S = ["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)"];
  const x = i => PL + (list.length === 1 ? iw/2 : (iw * i) / (list.length - 1));
  const y = v => PT + ih - (v/100) * ih;
  let g = "";
  [0,25,50,75,100].forEach(v => {
    g += '<line x1="' + PL + '" y1="' + round(y(v),1) + '" x2="' + (W-PR) + '" y2="' + round(y(v),1) + '" class="gridln"/>' +
         '<text x="' + (PL-6) + '" y="' + round(y(v)+3.5,1) + '" class="ax" text-anchor="end">' + v + '</text>';
  });
  let lines = "";
  const ends = [];
  domains.forEach((d, di) => {
    const pts = list.map((a, i) => (a.scores && a.scores[d] != null) ? [x(i), y(a.scores[d])] : null).filter(Boolean);
    if (pts.length < 2) return;
    lines += '<path d="' + pts.map((p, i) => (i ? "L" : "M") + round(p[0],1) + " " + round(p[1],1)).join(" ") +
             '" fill="none" stroke="' + S[di % 6] + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    pts.forEach(p => lines += '<circle cx="' + round(p[0],1) + '" cy="' + round(p[1],1) + '" r="3.4" fill="' + S[di % 6] + '" stroke="var(--surface)" stroke-width="1.6"/>');
    const lastP = pts[pts.length-1];
    ends.push({ y: lastP[1], y0: lastP[1], x: lastP[0], c: S[di % 6], lb: t("d."+d) });
  });
  /* Push overlapping end labels apart so every series stays readable. */
  ends.sort((a, b) => a.y - b.y);
  const MIN = 13;
  for (let i = 1; i < ends.length; i++)
    if (ends[i].y - ends[i-1].y < MIN) ends[i].y = ends[i-1].y + MIN;
  const overflow = ends.length ? Math.max(0, ends[ends.length-1].y - (PT + ih)) : 0;
  ends.forEach(e => e.y -= overflow);
  ends.forEach(e => {
    lines += '<line x1="' + round(e.x + 4,1) + '" y1="' + round(e.y0 != null ? e.y0 : e.y,1) + '" x2="' + round(e.x + 8,1) + '" y2="' + round(e.y,1) +
             '" stroke="' + e.c + '" stroke-width="1" opacity=".55"/>';
    lines += '<text x="' + round(e.x + 11,1) + '" y="' + round(e.y + 3.5,1) + '" class="ax" style="font-size:10.5px;fill:' + e.c +
             '">' + esc(e.lb) + '</text>';
  });
  let xl = "";
  list.forEach((a, i) => { xl += '<text x="' + round(x(i),1) + '" y="' + (H-6) + '" class="ax" text-anchor="middle">' + esc(fmtDate(a.date)) + '</text>'; });
  return '<div class="chartbox wide"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(t("ts.progress")) + '">' + g + lines + xl + '</svg></div>';
}
</script>

try{ View.theme = localStorage.getItem("altaris.theme") || null; }catch(e){}

            ["messages","nav.messages","chat"],["profile","nav.profile","user"]],

            ["audit","nav.audit","list"],["exercises","nav.exercises","book"],["profile","nav.profile","user"]]
};

function tabBadge(id){
  const me = Session.live(); if (!me) return 0;

/* ================================================================
   10. AUTH
   ================================================================ */

    (users.length ? (

      '<button class="btn pri wide" data-act="new-account">' + ic("plus") + esc(t("auth.create")) + '</button>' +
